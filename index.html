<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generative Emergency Preparedness Assistant</title><style>body{font-family:Segoe UI,Arial;background:#f4f7fb;margin:0;padding:20px}.wrap{max-width:1000px;margin:auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.1)}h1{color:#c62828}input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{background:#c62828;color:#fff;border:none;padding:12px 16px;border-radius:8px;cursor:pointer;margin:6px 0}.card{background:#fafafa;padding:15px;border-left:5px solid #c62828;border-radius:8px;margin-top:12px}.score{font-size:24px;font-weight:bold}</style></head><body><div class="wrap"><h1>🧠 Generative Emergency Preparedness Assistant</h1><p>AI-inspired offline emergency planning tool.</p><h3>Emergency Profile</h3><input id="name" placeholder="Name"><input id="blood" placeholder="Blood Group"><input id="allergy" placeholder="Allergies / Medical Notes"><input id="c1" placeholder="Emergency Contact 1"><input id="c2" placeholder="Emergency Contact 2"><button onclick="saveProfile()">Save Profile</button><h3>Emergency Situation</h3><select id="type"><option>Medical Emergency</option><option>Road Accident</option><option>Fire</option><option>Flood</option><option>Missing Person</option></select><input id="location" placeholder="Location"><select id="injured"><option>No</option><option>Yes</option></select><select id="safe"><option>Yes</option><option>No</option></select><button onclick="generate()">Generate AI Assessment</button><div id="out"></div></div><script>function saveProfile(){localStorage.profile=JSON.stringify({n:name.value,b:blood.value,a:allergy.value,c1:c1.value,c2:c2.value});alert('Profile saved');}window.onload=function(){if(localStorage.profile){let p=JSON.parse(localStorage.profile);name.value=p.n||'';blood.value=p.b||'';allergy.value=p.a||'';c1.value=p.c1||'';c2.value=p.c2||'';}};function generate(){let t=type.value,l=location.value,i=injured.value,s=safe.value;let risk='LOW';if(i==='Yes'&&s==='No')risk='HIGH';else if(i==='Yes')risk='MEDIUM';let assess=`AI Assessment

A ${t.toLowerCase()} has been reported near ${l||'the specified area'}. Based on the provided inputs, the current risk level is ${risk}.`;let plan=`1. Ensure personal safety.
2. Contact emergency services if required.
3. Inform emergency contacts.
4. Follow local authority guidance.`;let community=`Community Alert: Residents near ${l||'the area'} should stay alert regarding the reported ${t.toLowerCase()}.`;let scenario=`Training Scenario: Imagine a ${t.toLowerCase()} occurring unexpectedly. Review evacuation routes, communication methods and emergency contacts.`;let score=40;if(c1.value)score+=20;if(c2.value)score+=20;if(blood.value)score+=10;if(allergy.value)score+=10;let msg=`EMERGENCY ALERT
Type: ${t}
Location: ${l}
Risk: ${risk}
Please contact me if assistance is needed.`;out.innerHTML=`<div class='card'><h3>🧠 AI Assessment</h3><pre>${assess}</pre></div><div class='card'><h3>📋 Personalized Safety Plan</h3><pre>${plan}</pre></div><div class='card'><h3>🚨 Emergency Message</h3><textarea id='msg'>${msg}</textarea><br><button onclick='navigator.clipboard.writeText(document.getElementById("msg").value)'>Copy Message</button></div><div class='card'><h3>📣 Community Alert</h3><pre>${community}</pre></div><div class='card'><h3>🎓 Training Scenario</h3><pre>${scenario}</pre></div><div class='card'><h3>✅ Preparedness Score</h3><div class='score'>${score}/100</div></div>`;}</script></body></html>
